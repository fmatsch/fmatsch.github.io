<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>U4 × U6</title>
<meta name="description" content="Treffen sich U4 und U6 gerade in der Längenfeldgasse?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23e8325a' d='M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e0e10;--ink:#f4f4f2;--mute:#8a8a90;--u4:#00a04a;--u6:#b07a45;--heart:#ff3b64}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f2;--ink:#161618;--mute:#7a7a80;--u4:#008a3f;--u6:#9c6b3c;--heart:#ee2a55}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:24px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(14px,4vw,64px);font-weight:800;letter-spacing:-.04em;font-size:clamp(56px,18vw,260px);line-height:1}
.u4{color:var(--u4)}.u6{color:var(--u6)}
.mid{display:grid;place-items:center;width:.82em;height:.82em}
.x{width:100%;height:100%;stroke:var(--mute);stroke-width:5;stroke-linecap:round;opacity:.75;transition:opacity .3s}
.heart{display:none;width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 0 .08em color-mix(in srgb,var(--heart) 70%,transparent))}
.love .x{display:none}.love .heart{display:block;animation:beat .8s steps(2,jump-none) infinite}
@keyframes beat{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.sub{height:2.6em;text-align:center;color:var(--mute);font-size:clamp(13px,2.4vmin,18px);line-height:1.45;max-width:34em}
.sub b{color:var(--ink);font-weight:600}
.pix{position:fixed;pointer-events:none;width:14px;height:14px;image-rendering:pixelated;animation:float 2.8s linear forwards}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-70vh);opacity:0}}
footer{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;color:var(--mute);text-align:center;padding:0 16px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.love .heart,.pix{animation:none}}
</style>
</head>
<body>
<div class="row" id="row" aria-live="polite">
  <span class="u4">U4</span>
  <span class="mid">
    <svg class="x" viewBox="0 0 40 40" aria-label="treffen sich nicht"><path d="M6 6L34 34M34 6L6 34" fill="none"/></svg>
    <svg class="heart" viewBox="0 0 9 8" aria-label="treffen sich" shape-rendering="crispEdges">
      <path fill="#ff3b64" d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z"/>
      <path fill="#ff9db3" d="M1 1h1v1H1z"/>
      <path fill="#b5173a" d="M7 4h1v1H7zM6 5h1v1H6zM5 6h1v1H5z"/>
    </svg>
  </span>
  <span class="u6">U6</span>
</div>
<div class="sub" id="sub">&nbsp;</div>
<footer>Längenfeldgasse · berechnet aus Echtzeit-Abfahrtsdaten · Datenquelle: Stadt Wien – data.wien.gv.at / Wiener Linien · <a href="../wienerlinien/">Live-Karte</a></footer>
<script>
const API = (new URLSearchParams(location.search).get('api') || (/(^|\.)fmatsch\.ist$/.test(location.hostname) ? 'https://www.depes.ch/wl-api' : '')) + '/api/meeting';
const $ = (s) => document.querySelector(s);
let meetings = [], offset = 0, ok = false, loaded = false, lastLove = false, pairs = {};
const fmt = (s) => s < 90 ? 'in ' + Math.max(0, Math.round(s)) + ' s' : 'in ' + Math.round(s / 60) + ' min';

async function load() {
  try {
    const r = await (await fetch(API, {cache: 'no-store'})).json();
    if (!r.pairs) throw 0;
    loaded = true;
    offset = r.now - Date.now() / 1000; ok = r.ok; pairs = r.pairs;
    meetings = Object.entries(r.pairs).flatMap(([d, p]) => p.meetings.map(([a, b]) => ({a, b, u4: p.a, u6: p.b})));
  } catch (e) { ok = false; loaded = true; }
}
function tick() {
  const now = Date.now() / 1000 + offset;
  const cur = ok && meetings.find((m) => m.a <= now && now <= m.b);
  const love = !!cur;
  $('#row').classList.toggle('love', love);
  if (love && !lastLove) burst();
  lastLove = love;
  let txt;
  if (!loaded) txt = '&nbsp;';
  else if (!ok) txt = 'Gerade keine aktuellen Daten.';
  else if (love) txt = `<b>U4 → ${cur.u4}</b> und <b>U6 → ${cur.u6}</b> stehen gerade gemeinsam in der Längenfeldgasse.`;
  else {
    const nxt = meetings.filter((m) => m.a > now).sort((x, y) => x.a - y.a)[0];
    txt = nxt ? `Nächstes Treffen ${fmt(nxt.a - now)}: <b>U4 → ${nxt.u4}</b> × <b>U6 → ${nxt.u6}</b>` : 'In den nächsten Minuten treffen sie sich nicht.';
  }
  if ($('#sub').innerHTML !== txt) $('#sub').innerHTML = txt;
}
function burst() {
  const svg = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'><path fill='#ff3b64' d='M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z'/></svg>");
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 14; i++) {
    const e = document.createElement('img');
    e.src = svg; e.className = 'pix';
    e.style.left = Math.random() * 96 + 'vw'; e.style.bottom = (Math.random() * 20) + 'vh';
    e.style.animationDelay = (Math.random() * .8) + 's'; e.style.width = e.style.height = (10 + Math.random() * 16) + 'px';
    document.body.appendChild(e); setTimeout(() => e.remove(), 4000);
  }
}
load(); setInterval(load, 10000); setInterval(tick, 250);
</script>
</body>
</html>
